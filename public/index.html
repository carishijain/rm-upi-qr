<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>RM UPI QR</title>
<meta name="description" content="Generate a UPI payment QR instantly." />
<meta name="theme-color" content="#f6f5f1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="RM UPI QR" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="/css/style-20261003.css" />
<script>
  (function () {
    var t = localStorage.getItem("rm-upi-qr-theme") || "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>

<div id="app-loader" class="app-loader" role="status" aria-label="Loading">
  <!-- Gearbox loader from Uiverse.io by Nawsome -->
  <div class="gearbox">
    <div class="overlay"></div>
    <div class="gear one">
      <div class="gear-inner">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
    <div class="gear two">
      <div class="gear-inner">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
    <div class="gear three">
      <div class="gear-inner">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
    <div class="gear four large">
      <div class="gear-inner">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
  </div>
</div>


<script type="module" src="/js/loader.js"></script>

<header class="topbar">
  <a href="/" class="wordmark">
    <span class="brand-name">Raj Machinery</span>
    <span class="brand-loc">Mulund (W), Mumbai</span>
  </a>
  <div class="topbar-actions">
    <a href="/history.html" class="text-link">History</a>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode"></button>
  </div>
</header>

<main>

  <div id="approve-badge" class="approve-badge hidden">
    <a href="/history.html" id="approve-badge-link" class="approve-badge-link">
      <span id="approve-badge-text">Approve today's transactions</span>
    </a>
    <button type="button" id="approve-badge-dismiss" class="approve-badge-dismiss" aria-label="Dismiss">✕</button>
  </div>

  <section class="ticket" id="entry-view">
    <div class="readout">
      <div class="label">Enter amount</div>
      <div class="amount mono" id="amount-display">
        <span class="rupee">₹</span><span id="amount-text">0</span><span class="caret"></span>
      </div>
    </div>

    <div class="keypad" id="keypad" aria-label="Amount keypad">
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button data-key="." class="fn">.</button>
      <button data-key="0">0</button>
      <button data-key="back" id="backspace-btn" class="fn" aria-label="Delete last digit">⌫</button>
    </div>

    <div class="ticket-footer">
      <button class="primary-btn" id="generate-btn" disabled>Generate QR</button>
    </div>
  </section>

  <section class="qr-panel hidden" id="qr-view">
    <div class="qr-head">
      <div class="qr-amount mono" id="qr-amount-text">₹0</div>
      <div class="qr-payee">Scan with any UPI app to pay</div>
    </div>
    <div class="qr-canvas-wrap">
      <canvas id="qr-canvas"></canvas>
    </div>
    <div class="qr-actions">
      <button class="ghost-btn hidden" id="share-qr-btn">Share QR code</button>
      <button class="ghost-btn" id="copy-link-btn">Copy payment link</button>
      <button class="primary-btn" id="new-payment-btn">New payment</button>
    </div>
    <div class="save-note" id="save-note"></div>
  </section>

  <section class="split-view hidden" id="split-view">
    <div class="split-head">
      <div class="split-total mono" id="split-total-text">₹0</div>
      <div class="split-sub" id="split-sub-text">Split into 0 QR codes</div>
    </div>
    <div class="split-qr-list" id="split-qr-list"></div>
    <div class="qr-actions">
      <button class="ghost-btn hidden" id="split-share-btn">Share all as image</button>
      <button class="primary-btn" id="split-new-payment-btn">New payment</button>
    </div>
    <div class="save-note" id="split-save-note"></div>
  </section>

</main>

<div class="modal-backdrop hidden" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="modal">
    <h2 id="confirm-title">Confirm amount</h2>
    <div class="confirm-amount mono" id="confirm-amount-text">₹0</div>
    <div class="confirm-words" id="confirm-words-text"></div>
    <div class="modal-actions">
      <button class="ghost-btn" id="confirm-no">No, edit</button>
      <button class="primary-btn" id="confirm-yes">Yes, confirm</button>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="mode-modal" role="dialog" aria-modal="true" aria-labelledby="mode-title">
  <div class="modal">
    <h2 id="mode-title">How should this be paid?</h2>
    <div class="confirm-amount mono" id="mode-amount-text">₹0</div>
    <div class="mode-options">
      <button type="button" class="mode-option" id="mode-direct">
        <span class="mode-option-title">Pay Directly</span>
        <span class="mode-option-sub">One QR code</span>
      </button>
      <button type="button" class="mode-option" id="mode-split">
        <span class="mode-option-title">Split into Multiple QR Codes</span>
        <span class="mode-option-sub">Each ₹1,999 or below</span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/vendor/qrcode.min.js"></script>
<script type="module" src="/js/app.js?v=20260928a"></script>
<script type="module" src="/js/approve-badge.js"></script>
</body>
</html>
